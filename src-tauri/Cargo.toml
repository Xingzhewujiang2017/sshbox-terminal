[package]
name = "sshbox"
version = "0.7.2"
description = "SSH terminal with real-time VM monitoring"
authors = ["sshbox contributors"]
license = "MIT"
repository = "https://github.com/Xingzhewujiang2017/sshbox-terminal"
edition = "2021"

[lib]
name = "sshbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必需（官方模板自带，本项目曾缺）：tauri 的 build.rs 用
# `dev = !custom_protocol` 判定——不开这个 feature，release 构建也会
# 被 `cfg(dev)` 误导导航到 devUrl（localhost:1420），整页 ERR_CONNECTION_REFUSED。
# `npm run tauri build` 会自动传 `--features custom-protocol`；裸 cargo build 要用
# `--features custom-protocol` 或 `tauri/custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
keyring = "4.2.0"
dirs = "7.0.0"
chrono = "0.4.45"
tauri-plugin-log = "2.9.1"
tauri-plugin-notification = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# AI 请求只从 Rust 侧发：WebView 里发要处理 CORS，而且密钥会进页面内存。
# rustls 而非 native-tls：Windows 上不用链接 OpenSSL，CI 也好过。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# 只为了 GetLogicalDrives 一个调用：一次位图拿到盘符列表，
# 比逐个 `A:\` 试 metadata 安全（不碰盘、不会被空光驱卡住）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
