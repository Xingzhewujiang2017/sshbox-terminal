[package]
name = "sshbox"
version = "0.2.0"
description = "SSH terminal with real-time VM monitoring"
authors = ["sshbox contributors"]
edition = "2021"

[lib]
name = "sshbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
keyring = "4.2.0"
dirs = "7.0.0"
chrono = "0.4.45"
tauri-plugin-log = "2.9.1"
tauri-plugin-notification = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
