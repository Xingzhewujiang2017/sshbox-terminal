name: Release Linux

# 在 Linux 上构建 .deb 与 AppImage，并挂到对应 GitHub Release。
# 用法：
#   1) 打 tag 推送（v*）自动触发；
#   2) 或手动触发并填 tag（已有 Release 时只补传 Linux 产物）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传到的 Release tag（例如 v0.7.3）'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上的系统依赖（webkit2gtk-4.1 = Tauri v2）
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libnotify-dev \
            patchelf \
            build-essential \
            curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build .deb + AppImage
        run: npm run tauri build -- --bundles deb,appimage

      - name: List bundles
        run: |
          ls -la src-tauri/target/release/bundle/deb/ || true
          ls -la src-tauri/target/release/bundle/appimage/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sshbox-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "上传到 Release: $TAG"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
