name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 测试脚本用 `node --experimental-strip-types`（Node 22+ 才有），
          # 20 会报 "node: bad option"，CI 直接红。
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run test:ts

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --lib
        working-directory: src-tauri